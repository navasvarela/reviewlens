name: Walkdiff

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    # An analysis problem should never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Runs this repository's own copy; other repositories use navasvarela/walkdiff@main.
      - uses: ./
