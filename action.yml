name: Walkdiff
description: Adds a review report to each pull request, with changed units, callers, risk findings and an optional AI review
branding:
  icon: search
  color: blue

inputs:
  token:
    description: Token that can read the repository and comment on pull requests
    default: ${{ github.token }}
  ai:
    description: Set to "true" to send the changed code to the AI provider for a review
    default: "false"
  anthropic-api-key:
    description: Anthropic API key, for AI review with Anthropic
    default: ""
  ai-provider:
    description: anthropic, or openai-compatible for OpenAI and other services
    default: "anthropic"
  ai-model:
    description: The model to use; required with openai-compatible
    default: ""
  ai-base-url:
    description: With openai-compatible, the provider's address
    default: ""
  ai-api-key:
    description: With openai-compatible, the provider's API key
    default: ""
  coverage-file:
    description: Path to an LCOV or Cobertura report from an earlier step, to show whether changed lines ran in tests
    default: ""
  retention-days:
    description: Days to keep the report artifact
    default: "14"

outputs:
  report-url:
    description: Link to the report artifact
    value: ${{ steps.upload.outputs.artifact-url }}

# Inputs reach scripts through env, never `${{ }}` inside `run`, so no value can be
# interpreted as shell code. The action reads the PR's code but never executes it, so it
# does not need a checkout and is safe to run on PRs from forks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        # Node 25 and later no longer ship corepack.
        node-version: "24"

    - name: Install Walkdiff
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm build:ui

    - name: Analyze the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        WALKDIFF_AI: ${{ inputs.ai }}
        WALKDIFF_COVERAGE: ${{ inputs.coverage-file }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        WALKDIFF_AI_PROVIDER: ${{ inputs.ai-provider }}
        WALKDIFF_AI_MODEL: ${{ inputs.ai-model }}
        WALKDIFF_AI_BASE_URL: ${{ inputs.ai-base-url }}
        WALKDIFF_AI_API_KEY: ${{ inputs.ai-api-key }}
      run: |
        args=(review --no-serve --out "$RUNNER_TEMP/walkdiff")
        if [ "$WALKDIFF_AI" = "true" ]; then args+=(--ai --ai-provider "$WALKDIFF_AI_PROVIDER"); fi
        if [ "$WALKDIFF_AI" = "true" ] && [ -n "$WALKDIFF_AI_MODEL" ]; then args+=(--ai-model "$WALKDIFF_AI_MODEL"); fi
        if [ "$WALKDIFF_AI" = "true" ] && [ -n "$WALKDIFF_AI_BASE_URL" ]; then args+=(--ai-base-url "$WALKDIFF_AI_BASE_URL"); fi
        if [ -n "$WALKDIFF_COVERAGE" ]; then args+=(--coverage "$WALKDIFF_COVERAGE"); fi
        node "$GITHUB_ACTION_PATH/packages/cli/src/main.ts" "${args[@]}"
        cp "$RUNNER_TEMP/walkdiff/index.html" "$RUNNER_TEMP/walkdiff/walkdiff-report.html"

    - name: Upload the report
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        path: ${{ runner.temp }}/walkdiff/walkdiff-report.html
        # Unzipped, so the link gives reviewers the page itself. The artifact takes the
        # file's name; overwrite lets the job be re-run.
        archive: false
        overwrite: true
        retention-days: ${{ inputs.retention-days }}

    - name: Comment on the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: node "$GITHUB_ACTION_PATH/packages/cli/src/main.ts" comment --report "$RUNNER_TEMP/walkdiff" --report-url "$REPORT_URL"
